name: Build ColorOS lyrics bundle
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: burrunan/gradle-cache-action@v3

      - name: Apply patch
        run: |
          git apply --check morphe-music-coloros-lyricinfo.patch
          git apply morphe-music-coloros-lyricinfo.patch

      - name: Build bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: morphe-patches-coloros
          path: patches/build/libs/patches-*.mpp

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "coloros-${{ github.run_number }}" \
            patches/build/libs/patches-*.mpp \
            --title "ColorOS lyrics build ${{ github.run_number }}" \
            --notes "Morphe patches with ColorOS lyricInfo publishing"
